name: Pre-Tournament Picks

# Runs once a week, Tuesday morning, when fields are typically set.
on:
  # schedule:  # PAUSED until a local --dry-run passes; re-enable deliberately
  #    - cron: "0 13 * * 2"  # Tuesday 13:00 UTC — adjust to your timezone preference
  workflow_dispatch:
    inputs:
      event_tag:
        description: 'Real event hashtag for majors, e.g. #USOpen. Leave blank for normal weeks.'
        required: false
        default: ''
      dry_run:
        description: 'true = dry run (nothing saved). false = draft, or a real post only if the AUTO_POST repo variable is true.'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one tour failing (e.g. off week) shouldn't stop the other
      matrix:
        tour: [pga, euro]  # PGA Tour + DP World Tour; each keeps its own state file
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install card fonts
        # render.py's templates use the fonts in fonts/; without this step cairo
        # silently falls back to a default font and the cards look wrong.
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list : family | grep -E "Anton|DM Serif Display|Permanent Marker|Barlow" || { echo "card fonts missing"; exit 1; }

      - name: Configure git identity for auto-commits
        run: |
          git config user.name "scratch-sheet-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Generate and post weekly picks
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          POST_PLATFORMS: ${{ vars.POST_PLATFORMS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Posting is manual until the AUTO_POST repo variable is set to true:
          # until then scheduled runs make drafts (saved state + image/caption attached to the run).
          FLAG="--draft"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"
          elif [ "${{ vars.AUTO_POST }}" = "true" ]; then FLAG=""; fi
          echo "mode: ${FLAG:-real post}"
          python pipeline.py picks --tour ${{ matrix.tour }} --event-tag "${{ github.event.inputs.event_tag }}" $FLAG

      - name: Attach post drafts (card + caption) to this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-drafts-${{ matrix.tour }}
          path: |
            output/*.png
            output/*.txt
          if-no-files-found: ignore
          retention-days: 14
