name: Check Meta credentials

# Manual only. Verifies the Facebook Page + Instagram setup WITHOUT posting: the Page token is
# valid, never expires and has the publishing permissions, the Page's linked Instagram account
# matches META_IG_USER_ID, and (end to end) a sample card hosted the same way real posts are is
# accepted by Instagram as an UNPUBLISHED container (never shown; expires in 24 h). Free.
on:
  workflow_dispatch: {}

permissions:
  contents: write  # image_host.py pushes the sample card to the media branch, like a real post

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # media-branch worktree, same as live_round

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install card fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f

      - name: Render a sample card and host it like a real post
        id: host
        run: |
          git config user.name "scratch-sheet-bot"
          git config user.email "bot@users.noreply.github.com"
          python preview_cards.py output/previews
          echo "url=$(python -c 'from distribute import image_host; print(image_host.publish_image("output/previews/sample/weekly_picks.png"))')" >> "$GITHUB_OUTPUT"

      - name: Check credentials (no post)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python -m distribute.post_meta --check "${{ steps.host.outputs.url }}"
