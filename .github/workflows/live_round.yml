name: Live Round Polling

# Every 5 minutes, Thursday through Sunday (typical tournament rounds).
# GitHub's cron has ~5 min minimum granularity and can be delayed under load —
# fine for this use case, DataGolf itself only refreshes every 5 min anyway.
# pipeline.py exits fast (one cheap API call) if no round is actually live,
# so running this broadly across tournament weeks doesn't waste real work.
on:
  schedule:  # ON from 2026-10-07 in DRAFT mode (AUTO_POST unset = drafts only, nothing posts)
    # Wed-Sun UTC covers Asia round 1 (e.g. Japan starts Wed ~22:30 UTC) through Sunday;
    # Mon 00-03 UTC covers US Sunday-evening finishes (Pacific events end ~01:00 UTC Monday).
    - cron: "*/5 * * * 3,4,5,6,0"
    - cron: "*/5 0-3 * * 1"
  workflow_dispatch:
    inputs:
      event_tag:
        description: 'Real event hashtag for majors, e.g. #USOpen. Leave blank for normal weeks.'
        required: false
        default: ''
      dry_run:
        description: 'true = dry run (nothing saved). false = draft, or a real post only if the AUTO_POST repo variable is true.'
        required: false
        default: 'true'

concurrency:  # one poll at a time: overlapping runs would race on the saved state
  group: live-round
  cancel-in-progress: false

permissions:
  contents: write  # needed for image_host.py and state.py to commit back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one tour failing (e.g. off week) shouldn't stop the other
      matrix:
        tour: [pga, euro]  # PGA Tour + DP World Tour; each keeps its own state file
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for the media-branch worktree trick

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install card fonts
        # render.py's templates use the fonts in fonts/; without this step cairo
        # silently falls back to a default font and the cards look wrong.
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list : family | grep -E "Anton|DM Serif Display|Permanent Marker|Barlow" || { echo "card fonts missing"; exit 1; }

      - name: Configure git identity for auto-commits
        run: |
          git config user.name "scratch-sheet-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Run live poll
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          POST_PLATFORMS: ${{ vars.POST_PLATFORMS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Posting is manual until the AUTO_POST repo variable is set to true:
          # until then scheduled runs make drafts (saved state + image/caption attached to the run).
          FLAG="--draft"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"
          elif [ "${{ vars.AUTO_POST }}" = "true" ]; then FLAG=""; fi
          echo "mode: ${FLAG:-real post}"
          python pipeline.py live --tour ${{ matrix.tour }} --event-tag "${{ github.event.inputs.event_tag }}" $FLAG

      - name: Attach post drafts (card + caption) to this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-drafts-${{ matrix.tour }}
          path: |
            output/*.png
            output/*.txt
          if-no-files-found: ignore
          retention-days: 14
